<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Trading App</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: gold;
    }
    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>Gold Trading App</h1>

<div class="card">
  <h2>Live Gold Price</h2>
  <!-- TradingView Widget -->
  <div class="tradingview-widget-container">
    <div id="tradingview_gold"></div>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
      new TradingView.widget({
        "width": "100%",
        "height": 400,
        "symbol": "OANDA:XAUUSD",
        "interval": "5",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#1e293b",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "container_id": "tradingview_gold"
      });
    </script>
  </div>
</div>

</body>
</html>
