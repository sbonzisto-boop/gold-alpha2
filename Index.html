<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Edge">

<title>Gold Edge Terminal</title>

<style>
body {
  background:#0f172a;
  color:white;
  font-family:Arial;
  padding:15px;
}
h1 { color:gold; text-align:center; }
.card {
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
input, select, button {
  width:100%;
  padding:8px;
  margin-top:8px;
  border-radius:6px;
  border:none;
}
button {
  background:gold;
  font-weight:bold;
  cursor:pointer;
}
#result {
  margin-top:15px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>Gold Edge Terminal</h1>

<div class="card">
  <div id="tv_chart"></div>
</div>

<div class="card">
  <h3>Trade Setup Confirmation</h3>

  <label>Current Gold Price</label>
  <input type="number" id="price" placeholder="e.g. 2400">

  <label>Account Size ($)</label>
  <input type="number" id="account" placeholder="e.g. 10000">

  <label>Risk % Per Trade</label>
  <input type="number" id="risk" placeholder="e.g. 1">

  <label>Trend</label>
  <select id="trend">
    <option value="buy">Above 200 EMA (Bullish)</option>
    <option value="sell">Below 200 EMA (Bearish)</option>
  </select>

  <label>DXY Direction</label>
  <select id="dxy">
    <option value="down">Falling</option>
    <option value="up">Rising</option>
  </select>

  <button onclick="generateTrade()">Generate Entry Plan</button>

  <div id="result"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  "width":"100%",
  "height":500,
  "symbol":"OANDA:XAUUSD",
  "interval":"5",
  "theme":"dark",
  "style":"1",
  "locale":"en",
  "toolbar_bg":"#1e293b",
  "allow_symbol_change":true,
  "watchlist":[
    "OANDA:XAUUSD",
    "TVC:DXY",
    "FRED:DGS10"
  ],
  "container_id":"tv_chart"
});

function generateTrade(){

  const price = parseFloat(document.getElementById("price").value);
  const account = parseFloat(document.getElementById("account").value);
  const riskPercent = parseFloat(document.getElementById("risk").value);
  const trend = document.getElementById("trend").value;
  const dxy = document.getElementById("dxy").value;

  if(!price || !account || !riskPercent){
    alert("Fill all fields");
    return;
  }

  let direction = "";
  if(trend === "buy" && dxy === "down"){
    direction = "BUY";
  } else if(trend === "sell" && dxy === "up"){
    direction = "SELL";
  } else {
    document.getElementById("result").innerHTML =
      "<b>No valid setup. Conditions not aligned.</b>";
    return;
  }

  const riskAmount = account * (riskPercent/100);
  const stopDistance = price * 0.005; // 0.5% SL
  let stopLoss, tp1, tp2;

  if(direction === "BUY"){
    stopLoss = price - stopDistance;
    tp1 = price + stopDistance;
    tp2 = price + (stopDistance*2);
  } else {
    stopLoss = price + stopDistance;
    tp1 = price - stopDistance;
    tp2 = price - (stopDistance*2);
  }

  const positionSize = (riskAmount / stopDistance).toFixed(2);

  document.getElementById("result").innerHTML =
    "<b>Signal:</b> " + direction + "<br>" +
    "Entry: " + price.toFixed(2) + "<br>" +
    "Stop Loss: " + stopLoss.toFixed(2) + "<br>" +
    "TP1: " + tp1.toFixed(2) + "<br>" +
    "TP2: " + tp2.toFixed(2) + "<br>" +
    "Position Size (oz): " + positionSize;

  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  audio.play();
}
</script>

</body>
</html>
