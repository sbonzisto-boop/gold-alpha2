<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Trading App</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  padding: 20px;
  transition: background 0.3s ease;
}
h1 {
  color: gold;
  text-align: center;
}
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}
select, button {
  padding: 8px;
  margin-top: 5px;
  font-size: 16px;
}
button {
  background: gold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover {
  opacity: 0.8;
}
#signal {
  font-size: 26px;
  font-weight: bold;
}
#confidence {
  font-size: 18px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>Gold Trading App</h1>

<div class="card">
  <div class="tradingview-widget-container" style="height:600px;">
    <div id="tradingview_full"></div>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
      new TradingView.widget({
        "width": "100%",
        "height": 600,
        "symbol": "OANDA:XAUUSD",
        "interval": "5",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#1e293b",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "watchlist": [
          "OANDA:XAUUSD",
          "TVC:DXY",
          "FRED:DGS10"
        ],
        "container_id": "tradingview_full"
      });
    </script>
  </div>
</div>

<div class="card">
  <h2>Macro Signal Engine</h2>

  <label>DXY Direction:</label><br>
  <select id="dxy">
    <option value="down">Falling</option>
    <option value="up">Rising</option>
  </select>

  <br><br>

  <label>10Y Yield Direction:</label><br>
  <select id="yield">
    <option value="down">Falling</option>
    <option value="up">Rising</option>
  </select>

  <br><br>

  <label>Gold Trend (5M):</label><br>
  <select id="trend">
    <option value="up">Above 200 EMA</option>
    <option value="down">Below 200 EMA</option>
  </select>

  <br><br>

  <button onclick="calculateSignal()">Update Signal</button>

  <h2 id="signal" style="margin-top:20px;">Signal: NEUTRAL ⚖️</h2>
  <div id="confidence">Confidence: 0%</div>
</div>

<script>
let lastSignal = "";

function playBeep() {
  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  audio.play();
}

function calculateSignal() {
  const dxy = document.getElementById("dxy").value;
  const yieldDir = document.getElementById("yield").value;
  const trend = document.getElementById("trend").value;

  const signalBox = document.getElementById("signal");
  const confidenceBox = document.getElementById("confidence");

  let score = 0;

  if (dxy === "down") score += 30;
  if (yieldDir === "down") score += 30;
  if (trend === "up") score += 40;

  let signal = "NEUTRAL ⚖️";
  let bgColor = "#0f172a";
  let color = "white";

  if (score >= 70) {
    signal = "BUY BIAS ✅";
    bgColor = "#062e1f";
    color = "lightgreen";
  } else if (score <= 30) {
    signal = "SELL BIAS ❌";
    bgColor = "#3a0f0f";
    color = "red";
  }

  signalBox.innerHTML = "Signal: " + signal;
  signalBox.style.color = color;
  confidenceBox.innerHTML = "Confidence: " + score + "%";
  document.body.style.background = bgColor;

  if (signal !== lastSignal) {
    playBeep();
    lastSignal = signal;
  }
}
</script>

</body>
</html>
