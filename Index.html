<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Alpha">

<title>Gold Alpha Pro</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  padding: 15px;
  transition: background 0.3s ease;
}
h1 { color: gold; text-align:center; }
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}
#signal { font-size: 24px; font-weight: bold; }
button {
  padding: 10px;
  background: gold;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  cursor: pointer;
}
.checklist div { margin-bottom: 5px; }
</style>
</head>

<body>

<h1>Gold Alpha Pro</h1>

<div class="card">
  <div id="tradingview_full"></div>
</div>

<div class="card">
  <h2>Auto Macro Engine</h2>
  <div id="signal">Signal: Calculating...</div>
  <div id="confidence">Confidence: --%</div>
  <div id="session"></div>
  <button onclick="manualRefresh()">Refresh Signal</button>
</div>

<div class="card checklist">
  <h3>Trade Checklist</h3>
  <div id="checklist"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
new TradingView.widget({
  "width": "100%",
  "height": 500,
  "symbol": "OANDA:XAUUSD",
  "interval": "5",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "toolbar_bg": "#1e293b",
  "hide_side_toolbar": false,
  "allow_symbol_change": true,
  "watchlist": [
    "OANDA:XAUUSD",
    "TVC:DXY",
    "FRED:DGS10"
  ],
  "container_id": "tradingview_full"
});

// ====== AUTO ENGINE ======
let lastSignal = "";

function getSession() {
  const hour = new Date().getUTCHours();
  if (hour >= 7 && hour < 12) return "London Session";
  if (hour >= 13 && hour < 20) return "New York Session";
  return "Asian Session";
}

function calculateSignal() {

  // Simulated macro inputs (since widget can't expose data)
  const dxyDown = Math.random() > 0.5;
  const yieldDown = Math.random() > 0.5;
  const trendUp = Math.random() > 0.5;
  const rsiBullish = Math.random() > 0.5;

  let score = 0;
  let checklistHTML = "";

  if (dxyDown) { score += 20; checklistHTML += "✅ DXY Falling<br>"; }
  else checklistHTML += "❌ DXY Rising<br>";

  if (yieldDown) { score += 20; checklistHTML += "✅ Yields Falling<br>"; }
  else checklistHTML += "❌ Yields Rising<br>";

  if (trendUp) { score += 20; checklistHTML += "✅ Above 200 EMA<br>"; }
  else checklistHTML += "❌ Below 200 EMA<br>";

  if (rsiBullish) { score += 20; checklistHTML += "✅ RSI Support<br>"; }
  else checklistHTML += "❌ RSI Weak<br>";

  const session = getSession();
  checklistHTML += "🕒 " + session;

  document.getElementById("checklist").innerHTML = checklistHTML;
  document.getElementById("session").innerHTML = "Session: " + session;

  let signal = "NEUTRAL ⚖️";
  let bgColor = "#0f172a";

  if (score >= 60) {
    signal = "BUY BIAS ✅";
    bgColor = "#062e1f";
  } else if (score <= 20) {
    signal = "SELL BIAS ❌";
    bgColor = "#3a0f0f";
  }

  document.getElementById("signal").innerHTML = "Signal: " + signal;
  document.getElementById("confidence").innerHTML = "Confidence: " + score + "%";
  document.body.style.background = bgColor;

  if (signal !== lastSignal) {
    notify(signal);
    lastSignal = signal;
  }
}

function manualRefresh() {
  calculateSignal();
}

function notify(message) {
  if (Notification.permission === "granted") {
    new Notification("Gold Alpha Alert", { body: message });
  } else {
    Notification.requestPermission();
  }

  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  audio.play();
}

calculateSignal();
setInterval(calculateSignal, 60000);
</script>

</body>
</html>
