<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Trading App</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  padding: 20px;
}
h1 {
  color: gold;
  text-align: center;
}
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>Gold Trading App</h1>

<div class="card">
  <div class="tradingview-widget-container" style="height:600px;">
    <div id="tradingview_full"></div>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
      new TradingView.widget({
        "width": "100%",
        "height": 600,
        "symbol": "OANDA:XAUUSD",
        "interval": "5",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#1e293b",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "watchlist": [
          "OANDA:XAUUSD",
          "TVC:DXY",
          "FRED:DGS10"
        ],
        "container_id": "tradingview_full"
      });
    </script>
  </div>
</div>

</body>
</html>
