<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Trading App</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  padding: 20px;
}
h1 {
  color: gold;
  text-align: center;
}
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}
select, button {
  padding: 8px;
  margin-top: 5px;
  font-size: 16px;
}
button {
  background: gold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover {
  opacity: 0.8;
}
#signal {
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>Gold Trading App</h1>

<div class="card">
  <div class="tradingview-widget-container" style="height:600px;">
    <div id="tradingview_full"></div>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
      new TradingView.widget({
        "width": "100%",
        "height": 600,
        "symbol": "OANDA:XAUUSD",
        "interval": "5",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#1e293b",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "watchlist": [
          "OANDA:XAUUSD",
          "TVC:DXY",
          "FRED:DGS10"
        ],
        "container_id": "tradingview_full"
      });
    </script>
  </div>
</div>

<div class="card">
  <h2>Macro Signal Engine</h2>

  <label>DXY Direction:</label><br>
  <select id="dxy">
    <option value="down">Falling</option>
    <option value="up">Rising</option>
  </select>

  <br><br>

  <label>10Y Yield Direction:</label><br>
  <select id="yield">
    <option value="down">Falling</option>
    <option value="up">Rising</option>
  </select>

  <br><br>

  <button onclick="calculateSignal()">Update Signal</button>

  <h2 id="signal" style="margin-top:20px;">Signal: NEUTRAL ⚖️</h2>
</div>

<script>
function calculateSignal() {
  const dxy = document.getElementById("dxy").value;
  const yieldDir = document.getElementById("yield").value;
  const signalBox = document.getElementById("signal");

  if (dxy === "down" && yieldDir === "down") {
    signalBox.innerHTML = "Signal: BUY BIAS ✅";
    signalBox.style.color = "lightgreen";
  } else if (dxy === "up" && yieldDir === "up") {
    signalBox.innerHTML = "Signal: SELL BIAS ❌";
    signalBox.style.color = "red";
  } else {
    signalBox.innerHTML = "Signal: NEUTRAL ⚖️";
    signalBox.style.color = "white";
  }
}
</script>

</body>
</html>
